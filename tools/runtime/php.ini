; Baseline runtime lokal Hope Charity. Salin ke .local/runtime/php/php.ini.
[PHP]
extension_dir = "ext"
memory_limit = 512M
post_max_size = 8M
upload_max_filesize = 4M
max_file_uploads = 10
display_errors = Off
display_startup_errors = Off
log_errors = On
session.upload_progress.enabled = Off

extension = curl
extension = exif
extension = fileinfo
extension = gd
extension = intl
extension = mbstring
extension = openssl
extension = pdo_mysql
extension = pdo_sqlite
extension = sqlite3
extension = zip

[Date]
date.timezone = Asia/Jakarta
